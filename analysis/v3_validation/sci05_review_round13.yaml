findings:
  - id: R13-F1
    reviewer: codex
    severity: major
    title: GSE184257 gate misclassified as reading host programme states
    status: accepted-fixed
    resolution: >-
      The gate scores KSHV latent-veto against total KSHV molecules, which are viral programme states, so its run is
      outcome-generating. It waits for G3 execution clearance and the EVID-06 verdict freeze, and its results may not change
      any EVID-06 rule, label, threshold or exclusion (evid06_gse184257.no_workflow_rows_reason, DEV-038). Marked
      proposed_pending_user_signoff because it reverses user decision Q3.
  - id: R13-F2
    reviewer: codex
    severity: minor
    title: seeds.generation has no consumer contract; stale wording
    status: accepted-fixed
    resolution: >-
      seeds.generation.pending_reason now states that the generator takes generation_seed from its argument, that production
      mode must consume or enforce the signed value, and that the "root alone" and "not implemented" wording is gone. The
      simulator blocker carries the same requirement. The code change is not made here.
  - id: F1
    reviewer: biomni
    severity: blocker
    title: Download timing contradicts the Set 3 download
    status: accepted-fixed
    resolution: >-
      One global rule: acquisition and content hashing may precede the freeze for any dataset; no run that produces a viral
      call, count, tier, label or verdict precedes the verdict freeze. All "Downloaded only after" texts are replaced. Set 3
      (GSM6249889 to GSM6249892) was downloaded 2026-11-04, its eight sha256 values are recorded, and no run touched it.
  - id: F2
    reviewer: biomni
    severity: blocker
    title: Programme gate and EVID-06 firewall timing unresolved
    status: accepted-fixed
    resolution: Same as R13-F1. Pending the user's sign-off because it reverses Q3.
  - id: F3
    reviewer: biomni
    severity: major
    title: "Any other virus = presumed host artefact" conflates distinct classes
    status: accepted-fixed
    resolution: >-
      Split into unexpected but plausible (not counted against agreement), endogenous or integrated (ciHHV-6, HERV, integrated
      HPV chimeras; flagged and left out of the artefact tally) and technical artefact. Applied to all five listed rows.
  - id: F4
    reviewer: biomni
    severity: major
    title: GSE139324 (CD45-sorted immune cells) cannot be an HPV positive control
    status: accepted-fixed
    resolution: >-
      Re-scoped as an HPV specificity substrate, not dropped. HPV sits in epithelial tumour cells that CD45 sorting removes, so
      the library cannot test sensitivity, but the immune compartment still tests ambient tumour HPV. expected_targets is left
      at [HPV] because it is a dependent-fields digest input; the text says it names the virus whose absence is assessed.
  - id: F5
    reviewer: biomni
    severity: major
    title: GSE120926 non-malignant biopsies are not established EBV-negative
    status: accepted-fixed
    resolution: Labelled "EBV status unverified" and left out of the negative tally unless orthogonal EBV negativity exists.
  - id: F6
    reviewer: biomni
    severity: major
    title: KSHV truth is reporter based
    status: accepted-fixed
    resolution: >-
      Stated in the row. The cat42d KSHV accession is unconfirmed from tracked files: the package catalog lists RefSeq
      NC_009333.1; the paper used GQ994935.1 (JSC-1). It must be read from the cat42d GTF at the G4 rebuild.
  - id: F7
    reviewer: biomni
    severity: major
    title: One biological unit per arm
    status: accepted-fixed
    resolution: Per-library descriptive reporting with no pooling, written into the shared label rule and the three single-unit rows.
