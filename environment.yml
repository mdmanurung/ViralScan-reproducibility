name: viralscan-repro
channels: [conda-forge, bioconda]
dependencies:
  - python=3.11
  - pytest
  - pyyaml
  - jsonschema
  - numpy
  - pandas
  - scipy
  - anndata
  - scanpy
  - matplotlib
  # The package itself: install the pinned commit, or (when pip cannot build all dependencies) use PYTHONPATH via env.sh.
  - pip
  - pip:
      - "viralscan @ git+https://github.com/mdmanurung/ViralScan@6bfac9400ced58de99eb52db4dafe358aafc6735"
