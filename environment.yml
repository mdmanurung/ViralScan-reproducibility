name: viralscan-repro
channels: [conda-forge, bioconda]
dependencies:
  - python=3.11
  - pytest
  - pyyaml
  - jsonschema
  - numpy
  - pandas
  - scipy
  - anndata
  - scanpy
  - matplotlib
  # The package itself: install the pinned commit, or (when pip cannot build all dependencies) use PYTHONPATH via env.sh.
  - pip
  - pip:
      - "viralscan @ git+https://github.com/mdmanurung/ViralScan@f6aa5c0dac4a5fb62cbdd00d46c252c0bc47f0d7"
